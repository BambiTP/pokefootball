<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PokéFootball</title>
<link rel="icon" href="sprites/25.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>PokéFootball</h1>
  <input id="title" class="title-input" maxlength="40" placeholder="Team name" aria-label="Team name">
  <div class="actions">
    <button id="saveBtn" title="Save this lineup under a name">Save</button>
    <select id="loadSel" title="Load a saved lineup" aria-label="Load a saved lineup"><option value="">Load…</option></select>
    <button id="deleteBtn" title="Delete the selected saved lineup">Delete</button>
    <button id="clearBtn" title="Empty every position">Clear</button>
    <button id="hdBtn" title="Switch between classic pixel sprites and modern HD renders" aria-pressed="false">HD: off</button>
    <button id="shareBtn" title="Copy a link to this lineup">Share link</button>
    <button id="downloadBtn" class="primary">Download image</button>
    <button id="copyBtn" class="primary">Copy image</button>
  </div>
</header>

<main class="layout">
  <aside class="roster" id="roster">
    <input id="search" type="search" placeholder="Search name or #" aria-label="Search Pokémon">
    <p class="hint">Drag onto a position — or tap a Pokémon, then tap a position. Drag a placed one back here to remove it.</p>
    <ul id="list" class="list"></ul>
  </aside>

  <section class="field-wrap">
    <div id="field" class="field"></div>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>

<script src="pokemon.js"></script>
<script src="app.js"></script>
</body>
</html>
